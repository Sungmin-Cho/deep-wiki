# deep-wiki Schema Definition
# Machine-readable rules for wiki page structure and validation

runtime_authority:
  executable: scripts/wiki-runtime.js
  hosts: [claude, codex, windows, macos, linux]
  lock:
    acquisition: atomic-directory
    owner_record: .wiki-meta/.wiki-lock/owner.json
    credential: owner token
    recovery_command: lock recover
    direct_directory_removal: forbidden
  transaction:
    journal: .wiki-meta/.transactions/<operation_id>/journal.json
    receipt: .wiki-meta/.transaction-receipts/<operation_id>.json
    recovery_command: transaction recover
    terminal_prune_command: transaction prune
    transaction_quarantine_command: transaction quarantine
    quarantine_bundles: .wiki-meta/.quarantine/<stamp>-<pid>-<uuid>/
    maintenance_marker: .wiki-meta/.runtime/scan-window-maintenance.json
    quarantine_bundle_creators: ["scan-window ensure", "wiki-lint --fix", "transaction prune", "transaction quarantine"]
    quarantine_follow_up_argv_field: follow_up_argv
    terminal_prune_skipped_oversized_field: skipped_oversized
    terminal_prune_scope: validated-cleaned-scan-window-only
    terminal_prune_bounded: true
    terminal_prune_completion_field: complete
    terminal_prune_blocked_field: blocked
    terminal_prune_blocked_count_field: blocked_count
    terminal_prune_blocked_truncated_field: blocked_truncated
    terminal_prune_deferred_count_field: deferred_count
    terminal_prune_blocked_policy: "Observation only: blocked lists at most 32 store entries whose last outcome in the pass was a refusal (name, operation_id, stage, reason, code, canonical); blocked_count is exact for the pass and a lower bound when complete is false; deferred_count counts prune-family residue the caller's kind, age, or exclusion policy did not select; null counts mean the pass produced no observation. None of these fields changes deletion authority."
    terminal_prune_callers: ["scan-window ensure", "wiki-lint --fix", "transaction prune"]
    terminal_prune_ordinary_age_policy: "Only ordinary cleaned directories old enough for the caller policy are selected."
    terminal_prune_residue_policy: "Authenticated residue from an already-started prune may bypass the ordinary age gate, but authenticated already-started ensure residue remains protected when either marker was initially invalid; ordinary directories remain excluded in resumable-only mode."
    terminal_prune_recovery_authority: "Distinct from manifest transaction recover; ambiguous residue requires stopped-host manual intervention."
    terminal_prune_marker_acceptance: "Only exact canonical UTC-Z plus LF, one-link regular non-symlink .pending-scan and .last-scan files are accepted; lstat ENOENT alone is absent."
    terminal_prune_initial_invalid_policy: "Either initial-invalid marker suppresses every created, preserved, and stale ensure deletion for the whole pass, including authenticated already-started residue; authenticated already-started residue remains protected until a later pass begins with both markers accepted or absent."
    terminal_prune_physical_seal_policy: "Both accepted-or-absent marker physical seals are revalidated before every destructive boundary."
    terminal_prune_created_policy: "A created ensure is reclaimable only when pending does not match and exact .last-scan >= input.proposed; preserved and stale are no-op evidence."
    terminal_prune_compatibility_name_policy: "Every raw .reservation-.prune-* basename is rejected before type, suffix, or content parsing and requires stopped-host intervention."
    expected_hash_guard: true
  scan_window:
    pending: .wiki-meta/.pending-scan
    committed: .wiki-meta/.last-scan
    monotonic: true

page:
  frontmatter:
    required:
      - title        # Page title
      - sources      # List of source slugs that contributed
      - tags         # Classification tags
    optional:
      - aliases      # Alternative names for dedup/search

  link_format: markdown  # Standard markdown links: [Title](page-name.md)

  naming:
    format: kebab-case   # e.g., react-hooks.md, postgres-indexing.md
    extension: .md

source:
  location: .wiki-meta/sources/
  format: yaml
  required_fields:
    - id             # Unique slug
    - title          # Human-readable name
    - ingested_at    # ISO 8601 timestamp
    - type           # url | file | text | deep-work-report
    - origin         # URL, file path, or description
    - pages_created  # List of page filenames created (may be empty array `[]`)
    - pages_updated  # List of page filenames updated (may be empty array `[]`)
  optional_fields:
    - content_hash   # SHA-256 hash of source content at ingest time
    - partial_fail   # When the third failure registered on one pending window
                     # commits `ingest-fail` (wiki-ingest §4), the runtime
                     # replaces the named source's record with a minimal
                     # `origin`, `type: partial_fail`, `partial_fail: true`,
                     # `window` record that omits the required fields above.
                     # Its presence is the `partial-fail-recovery` repair
                     # reason below.

index:
  location: .wiki-meta/index.json
  rebuild_from: pages       # Can always be regenerated from page frontmatter
  # v1.5.0+: M3 cross-plugin envelope wrapper. Legacy {pages, generated_at}
  # shape is preserved inside `payload`; consumers MUST go through the
  # envelope-aware reader for forward compatibility (legacy pass-through too).
  envelope:
    schema_ref: https://raw.githubusercontent.com/Sungmin-Cho/claude-deep-suite/main/schemas/artifact-envelope.schema.json
    schema_version: "1.0"
    identity:                 # 3-way guard enforced by unwrapEnvelope() (handoff §4 round-4)
      producer: deep-wiki
      artifact_kind: index
      schema_name: index
      schema_version: "1.0"
    producer_version_source: .claude-plugin/plugin.json   # mirrors plugin.json.version (single source of truth)
    run_id_format: "ULID — 26-char Crockford Base32, MSB-first (lex sort = time sort)"
    parent_run_id: omitted    # multi-source aggregator — index.json은 page frontmatter scan 결과, single parent 없음
    source_artifacts: path-only   # markdown 페이지 — envelope detect 불가
    reader_path: hooks/scripts/read-index-envelope.js   # legacy + envelope 양쪽 통과 (graceful)
    writer_path: hooks/scripts/wrap-index-envelope.js   # atomic temp+rename, crash-safe
    validator_path: scripts/validate-envelope-emit.js   # release-lint, additionalProperties strict

log:
  location: log.jsonl
  format: jsonl        # Each line: {"ts": "...", "action": "...", "pages_created": [...], "pages_updated": [...], "source": "..."}
  ts_format: "ISO 8601 UTC with Z suffix, e.g. 2026-04-06T15:00:00Z (NEVER use local time offsets like +09:00)"
  classification:
    pages_created:
      rule: "File did not exist in pages/ before this manifest and has never appeared in pages_created in the log."
      invariant: "Each page filename appears in pages_created at most once across the entire log — including within a single multi-source batch."
    pages_updated:
      rule: "File existed in pages/ before this manifest."
    manifest_rule: "Runtime rule: within one manifest every page appears in exactly one event's list, matching its page action. Caller convention (/wiki-ingest §2): a page merged from several sources is listed by the event of its first contributing source in stable input order, and the other contributors' events omit it."
  optional_fields:     # v1.4.0+ schema-additive — wiki-lint Step 6 LOG-INVARIANT scan unaffected
    pages_failed:
      applies_to: [ingest]
      version: "v1.4.0+"
      rule: "Legacy v1.4.x field; the current runtime does not write it. Readers must tolerate it on historical `ingest` lines."
    phase_timing_ms:
      applies_to: [ingest]
      version: "v1.4.2+"
      shape: "{stage_1_analysis, stage_2_fanout, stage_3_write, total} — ms integers"
      rule: "Legacy v1.4.2 telemetry; the current runtime does not write it. Readers must tolerate it on historical `ingest` lines."
  actions:             # Valid action values
    - ingest
    - ingest-skip      # v1.2.0+: source dropped from batch because content_hash unchanged AND wiki-side state intact
    - ingest-repair    # v1.2.1+ (IC1 review fix): hash unchanged but wiki state drift detected (missing page, page-missing-slug, or non-terminal last log) — full ingest forced as self-repair. R3C1 review fix: pages_created MUST be [] (a self-repair restores an existing page's lifecycle, not a new creation; the historical `ingest` line is the canonical pages_created entry). All touched pages go to pages_updated regardless of PRE_BATCH_PAGES classification. wiki-lint Step 6 LOG-INVARIANT scan filters out ingest-repair lines as defense-in-depth.
    - ingest-fail      # v1.3.0+: emitted when the third failure registered through `scan-window fail` lands on the same `.pending-scan` window. Promotes the window despite failure (releases stuck state) and records one `partial_fail` source record plus one terminal event timestamped with that window. Counter `.wiki-meta/.pending-scan-retry-count` (format `<pending_scan_iso>:<count>`) restarts at 1 when the window changes and is removed after the terminal commit.
    - update
    - lint
    - rebuild
    - delete
    - query-filed      # Auto-filed query synthesis (cross-page synthesis from /wiki-query)
    - setup            # v1.0.0+: emitted by /wiki-setup on initial scaffold (welcome.md seed)
  repair_reasons:      # Valid `ingest-repair` reason values — see the skills/wiki-ingest/SKILL.md §1 unchanged-hash rule
    - missing-page             # page in log but not on disk
    - page-missing-slug        # page exists but its slug not in any provenance yaml
    - no-prior-terminal-log    # v1.2.1+ R3W2: log.jsonl absence OR non-terminal last log
    - partial-fail-recovery    # v1.4.0+: sources/<slug>.yaml carries the `partial_fail` marker from an `ingest-fail` commit

versions:
  location: .wiki-meta/.versions/
  keep: 3              # Versions to retain per page before pruning

a5_fanout:             # v1.4.0+: optional <wiki>/.wiki-meta/.config.json knobs
  location: .wiki-meta/.config.json
  optional: true       # absence = A5 defaults; the same file may still be created by auto_ingest migration
  loader: "scripts/wiki-runtime.js config resolve --json"
  knobs:
    a5_fanout_threshold:
      type: integer
      minimum: 1
      maximum: 9007199254740991
      default: 3
      semantics: "Accepted for compatibility only; no host reads it. /wiki-ingest runs main-caller-sequential on every host."
    a5_worker_timeout_sec:
      type: integer
      minimum: 1
      maximum: 9007199254740991
      default: 90
      semantics: "Accepted for compatibility only; no host reads it. /wiki-ingest runs main-caller-sequential on every host."

failure_state:         # v1.3.0+: partial-fail retry artifacts under .wiki-meta/
  failed_sources_manifest:
    location: .wiki-meta/.failed-sources.tsv
    format: tsv
    columns: [source_path, reason, ts]
    cleared_on: "full-success ingest batch"
    semantics: "Legacy v1.3.x artifact; the current runtime neither reads nor writes it. Retry state is window-level: the retry_counter below, plus the partial_fail record of the one source named by the terminal registration."
  retry_counter:
    location: .wiki-meta/.pending-scan-retry-count
    format: "<pending_scan_iso>:<count>"   # window key = verbatim .pending-scan ISO-8601 value; the count follows the last colon.
    threshold: 3       # failures registered on one pending window before ingest-fail emit
    cleared_on: "a different pending window (the count restarts at 1) or the terminal ingest-fail commit"
    semantics: "Counter of failures registered through `scan-window fail` on the current pending window. The third commits ingest-fail and promotes the window."
  pending_scan:
    location: .wiki-meta/.pending-scan
    format: "ISO 8601 UTC (YYYY-MM-DDTHH:MM:SSZ)"
    semantics: "Oldest detection-window awaiting ingest promotion. Written by SessionStart hook on first detection (never overwritten if valid — H1 regression guard from ultrareview bug_006). Promoted to .last-scan on successful ingest. Stale-recovery covered by wiki-lint Step 11/12."
  last_scan:
    location: .wiki-meta/.last-scan
    format: "ISO 8601 UTC (YYYY-MM-DDTHH:MM:SSZ)"
    invariant: "Monotonic — never regresses (v1.1.4 promotion regression guard enforced)."
    semantics: "Last committed scan window. SessionStart hook uses this as the lower bound for new-file detection."

auto_lint:
  trigger_after:         # Post-ingest auto-lint runs after these operations
    - ingest
    - rebuild
    - query-filed
  mode: read-only-diagnostics   # v1.7.1+: the post-ingest/rebuild auto-lint NEVER mutates wiki state (invariant #3 — every write acquires the lock). Diagnostics only.
  checks:
    - schema_compliance
    - broken_links
    - index_drift
    - orphan_detection
    - scan_window_invariant   # v1.2.0+
  auto_repair:           # v1.7.1+: NOT fixed silently here — delegated to the self-locking `/wiki-lint --fix` path (§13 Auto-Fix Phase A self-acquires .wiki-lock; Phase B → /wiki-rebuild). The post-ingest lint only reports drift; it does not mutate.
    delegated_to: "/wiki-lint --fix"
    under_lock: true
    items:
      - index_drift
      - excess_versions
      - stale_pending_scan      # v1.2.0+ (drops .pending-scan when older than .last-scan)
  report_only:           # Only report if issues found (no noise)
    - schema_violations
    - broken_links
    - orphan_pages

lint:
  orphan_ignore:
    type: list
    element: glob_pattern
    default: []
    semantics: "Page filenames matching any glob are not reported as orphans by /wiki-lint Step 3."
  leaf_tag:
    name: leaf
    semantics: "Frontmatter tags containing 'leaf' marks the page as an intentional orphan (archive, milestone, personal log)."

query_auto_filing:
  criteria:              # ALL must be true to auto-file
    - min_source_pages: 2
    - has_cross_page_insight: true
    - is_substantive: true
  filename_prefix: "query-"
  source_slug: "query-derived"
  default_tags:
    - query-synthesis

auto_ingest:
  optional: true
  owner: "wiki-local"
  config_block: "<wiki_root>/.wiki-meta/.config.json"
  accepted_keys: ["auto_ingest", "a5_fanout_threshold", "a5_worker_timeout_sec"]
  legacy_alias: "Global host YAML auto_ingest is only a bootstrap/legacy alias read from deep-wiki-config.yaml and migrated to the wiki-local owner when equivalent."
  migration_trigger: "setup and SessionStart migrate equivalent legacy global YAML auto_ingest into the wiki-local owner before scanning."
  retained_global_aliases: "Global host YAML remains accepted as bootstrap/legacy alias input until operators remove it after the migrated source is confirmed."
  invalid_local_fail_closed: "Non-regular file, symlink, duplicate key, invalid UTF-8, and >64 KiB wiki-local config states are CONFIG_INVALID."
  a5_preservation: "Migration preserves a5_fanout_threshold and a5_worker_timeout_sec while moving only auto_ingest ownership."
  conflict_recovery: "CONFIG_CONFLICT local-vs-legacy policy values require matching local and legacy values or deleting one policy block while hosts are stopped; CONFIG_CONFLICT candidates=... means cross-host candidate YAML files diverge and require reconciling the named host YAML files."
  filters:
    ignore_globs:
      type: list
      element: glob_pattern
      semantics: "Path glob (relative to vault root). Matching files are excluded from SessionStart auto-detect."
    require_tag:
      type: string
      default: ""
      semantics: "If non-empty, only files whose frontmatter tags contain this tag are auto-detected."
  default_behavior: "When wiki-local auto_ingest is absent, no legacy alias is present, or both keys are empty/missing, all modified .md files are detected (v1.1.x behavior). Equivalent absent versus explicit-empty legacy aliases converge; conflicting local and legacy policies fail closed."

recommended_tools:
  cli:
    - name: qmd
      package: "@tobilu/qmd"
      purpose: "Local markdown search with BM25/vector search and LLM re-ranking"
      check: "which qmd"
    - name: marp
      package: "@marp-team/marp-cli"
      purpose: "Generate slide presentations from markdown pages"
      check: "which marp"
    - name: obsidian
      purpose: "Obsidian CLI — search, backlinks, tags, properties via running Obsidian app"
      check: "node scripts/wiki-runtime.js probe obsidian --json"
      note: "Requires Obsidian app to be running. /wiki-setup detects the CLI automatically by searching DEEP_WIKI_OBSIDIAN_BIN, PATH, and well-known install locations; when enabled in configuration, /wiki-ingest uses the read-only search/backlinks/tags bridge for vault context."
  obsidian_plugins:
    - name: Dataview
      directory: dataview
      purpose: "Query page frontmatter for dynamic tables and lists"
    - name: Marp Slides
      directory: marp-slides
      purpose: "Render Marp slide decks in Obsidian"
    - name: Obsidian Web Clipper
      type: browser-extension
      url: "https://obsidian.md/clipper"
      purpose: "Clip web articles as markdown for quick ingest"
